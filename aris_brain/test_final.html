<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T</title>
<style>
:root {
  --bg: #000;
  --bg-alt: #0a0a0f;
  --surface: rgba(255,255,255,0.03);
  --text: #f5f5f7;
  --text-secondary: rgba(255,255,255,0.5);
  --accent: #7c7cff;
  --radius: 16px;
  --font: 'Inter', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter', -apple-system, sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
nav { position:fixed;top:0;width:100%;z-index:100;padding:16px 40px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(24px);background:rgba(0,0,0,0.7);border-bottom:1px solid var(--border,rgba(255,255,255,0.05)); }
nav a { color:var(--text-secondary);text-decoration:none;font-size:12px;font-weight:500;transition:color.3s }
nav a:hover { color:var(--text) }
@media (max-width:768px) { [style*="grid-template-columns"] { grid-template-columns:1fr!important; } section { padding:60px 20px!important; } nav { padding:12px 20px; } }

</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

</head>
<body>

<section style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden">
  
  <div style="position:relative;z-index:1;padding:0 20px">
    
    <h1 style="font-size:clamp(48px,8vw,88px);font-weight:800;letter-spacing:-3px;line-height:1.05;margin-bottom:20px;background:linear-gradient(180deg,var(--text),var(--text-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Test</h1>
    <p style="font-size:clamp(16px,2vw,22px);color:var(--text-secondary);max-width:680px;margin:0 auto 32px;line-height:1.6">ok</p>
    
  </div>
</section>
<footer style="text-align:center;padding:48px 40px;border-top:1px solid var(--border,rgba(255,255,255,0.05));font-size:12px;color:var(--text-tertiary,rgba(255,255,255,0.2))">ok</footer>
<script>
document.querySelectorAll("[style*='padding:32px']").forEach(el=>{const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){el.style.opacity="1";el.style.transform="translateY(0)";o.unobserve(el)}},{threshold:.1});el.style.opacity="0";el.style.transform="translateY(30px)";el.style.transition="all .8s cubic-bezier(.16,1,.3,1)";o.observe(el);});
</script>
</body>
</html>
