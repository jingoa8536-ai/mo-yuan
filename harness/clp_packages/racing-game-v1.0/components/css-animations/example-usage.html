<!--
  CSS Keyframes Pack 示例装配代码

  展示如何 import 并应用到 React 组件
  实际来源：D:/ai-website-cloner-template-master/src/app/globals.css + test-race/page.tsx
-->

<!-- ============ 1. 在 globals.css 中 import ============ -->
<style>
  @import "tailwindcss";
  @import "tw-animate-css";
  @import "shadcn/tailwind.css";
  @import "./apex-animations.css";  /* ← CLP 组件 */

  :root {
    --background: #0c1219;
    --primary: #3683ff;
    --accent: #ffd76a;
    --destructive: #ff6b6b;
  }
</style>

<!-- ============ 2. HUD 面板进入动画 ============ -->
<div class="absolute top-20 left-6 z-10 animate-racing-hud-rise">
  <div class="bg-[#0a1018]/90 backdrop-blur-xl rounded-lg border border-gray-700/30 p-4 shadow-xl">
    <h3>圈数 + 排名</h3>
  </div>
</div>

<!-- ============ 3. RPM 红线闪烁 ============ -->
<div class="font-stats text-2xl text-red-500 animate-racing-hud-blink">
  8500
</div>

<!-- ============ 4. 首页排行榜逐行进入（带延迟） ============ -->
<ul>
  <li style="animation-delay: 0ms" class="animate-home-lb-row-in">第 1 名</li>
  <li style="animation-delay: 50ms" class="animate-home-lb-row-in">第 2 名</li>
  <li style="animation-delay: 100ms" class="animate-home-lb-row-in">第 3 名</li>
  <li style="animation-delay: 150ms" class="animate-home-lb-row-in">第 4 名</li>
</ul>

<!-- ============ 5. LIVE 指示器脉动 ============ -->
<span class="w-2 h-2 rounded-full bg-red-500 animate-home-live-pulse"></span>
<span class="text-xs font-ui text-red-400">LIVE</span>

<!-- ============ 6. 角落面板进入 ============ -->
<div class="absolute bottom-6 right-6 animate-home-corner-panel-rise">
  <div class="bg-[#0a1018]/90 rounded-xl p-4">
    <p>右下角面板</p>
  </div>
</div>

<!-- ============ 7. 缩略图呼吸 + 图片补偿 ============ -->
<div class="thumb-frame animate-thumb-frame-breathe">
  <img src="/track.jpg" class="animate-thumb-img-compensate" />
</div>

<!-- ============ 8. 设置面板进入 ============ -->
<div class="fixed inset-0 bg-black/60 flex items-center justify-center">
  <div class="bg-[#0a1018] rounded-2xl p-6 animate-settings-panel-rise">
    <h2>设置</h2>
  </div>
</div>

<!-- ============ 9. 启动加载点动画 ============ -->
<div class="flex gap-1">
  <span class="w-2 h-2 bg-[#3683ff] rounded-full animate-splash-loading-dot"></span>
  <span class="w-2 h-2 bg-[#3683ff] rounded-full animate-splash-loading-dot" style="animation-delay: 0.16s"></span>
  <span class="w-2 h-2 bg-[#3683ff] rounded-full animate-splash-loading-dot" style="animation-delay: 0.32s"></span>
</div>

<!-- ============ 10. 时钟分隔符闪烁 ============ -->
<span class="font-time text-2xl">
  14<span class="animate-clock-blink">:</span>30
</span>

<!-- ============ 11. 车轮旋转（车辆加载中） ============ -->
<svg class="w-8 h-8 animate-wheel-spin" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
  <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="2" />
</svg>

<!-- ============ 12. 保存成功 toast ============ -->
<div class="fixed top-6 right-6 animate-pm-saved-toast">
  <div class="bg-green-500/20 border border-green-500/40 rounded-lg px-4 py-2">
    已保存
  </div>
</div>
