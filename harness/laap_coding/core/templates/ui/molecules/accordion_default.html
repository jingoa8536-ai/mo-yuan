<div class="accordion-container space-y-3">
  {% for item in items %}
  <div class="accordion-item rounded-xl bg-white/5 border border-white/10 overflow-hidden">
    <button class="accordion-header w-full px-6 py-4 flex items-center justify-between text-left hover:bg-white/5 transition-colors">
      <span class="font-medium text-white">{{ item.question }}</span>
      <svg class="accordion-icon w-5 h-5 text-gray-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>
    <div class="accordion-content px-6 py-4 text-sm text-gray-400 bg-white/5">
      {{ item.answer }}
    </div>
  </div>
  {% endfor %}
</div>
