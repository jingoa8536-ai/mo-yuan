<div class="card-default group relative p-6 rounded-2xl bg-white/5 border border-white/10 hover:border-indigo-500/30 hover:bg-white/10 hover:-translate-y-1 transition-all duration-300">
  <div class="card-icon mb-4 w-12 h-12 rounded-xl bg-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-500/30 transition-colors">
    {{ icon }}
  </div>
  <h3 class="card-title text-lg font-semibold text-white mb-2">{{ title }}</h3>
  <p class="card-desc text-gray-400 text-sm leading-relaxed">{{ description }}</p>
</div>
