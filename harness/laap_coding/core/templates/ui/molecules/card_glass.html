<div class="card-glass group relative p-6 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 hover:border-indigo-500/40 hover:bg-white/10 hover:-translate-y-2 transition-all duration-500 shadow-lg shadow-black/20">
  <div class="card-icon mb-4 w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500/30 to-purple-500/30 flex items-center justify-center text-indigo-300 group-hover:scale-110 transition-transform">
    {{ icon }}
  </div>
  <h3 class="card-title text-lg font-semibold text-white mb-2">{{ title }}</h3>
  <p class="card-desc text-gray-300 text-sm leading-relaxed">{{ description }}</p>
</div>
