<div class="card-pricing relative p-8 rounded-2xl bg-white/5 border border-white/10 hover:border-indigo-500/40 transition-all duration-300">
  <div class="pricing-badge absolute -top-3 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full text-xs font-bold bg-indigo-500 text-white">
    {{ badge }}
  </div>
  <h3 class="pricing-title text-xl font-bold text-white mb-2">{{ title }}</h3>
  <div class="pricing-price flex items-baseline gap-1 mb-4">
    <span class="text-4xl font-bold text-white">{{ price }}</span>
    <span class="text-gray-400">/ {{ period }}</span>
  </div>
  <p class="pricing-desc text-gray-400 text-sm mb-6">{{ description }}</p>
  <ul class="pricing-features space-y-3 mb-8">
    {% for feature in features %}
    <li class="flex items-center gap-3 text-sm text-gray-300">
      <svg class="w-5 h-5 text-green-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      {{ feature }}
    </li>
    {% endfor %}
  </ul>
  <button class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold hover:shadow-lg hover:shadow-indigo-500/30 transition-all">
    {{ cta }}
  </button>
</div>
