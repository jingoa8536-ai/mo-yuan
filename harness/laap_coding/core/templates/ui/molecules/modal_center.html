<div class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="modal-content relative w-full max-w-md mx-4 p-6 rounded-2xl bg-white/10 border border-white/20 backdrop-blur-xl shadow-2xl">
    <button class="modal-close absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/60 hover:text-white transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <h3 class="modal-title text-xl font-bold text-white mb-2">{{ title }}</h3>
    <p class="modal-desc text-gray-400 mb-6">{{ description }}</p>
    <div class="modal-actions flex gap-3">
      <button class="flex-1 py-3 rounded-xl bg-white/10 text-white font-medium hover:bg-white/20 transition-colors">Cancel</button>
      <button class="flex-1 py-3 rounded-xl bg-indigo-500 text-white font-medium hover:bg-indigo-600 transition-colors">Confirm</button>
    </div>
  </div>
</div>
