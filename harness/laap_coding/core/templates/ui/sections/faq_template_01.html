<section class="faq-section py-20 px-4">
  <div class="max-w-3xl mx-auto">
    <div class="section-header text-center mb-12">
      <span class="section-label inline-block px-4 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold tracking-wider uppercase mb-4">
        {{ section_label }}
      </span>
      <h2 class="section-title text-3xl md:text-4xl font-bold text-white mb-4">{{ title }}</h2>
      <p class="section-desc text-gray-400">{{ description }}</p>
    </div>
    <div class="faq-accordion space-y-4">
      {% for item in faqs %}
      <div class="faq-item rounded-xl bg-white/5 border border-white/10 overflow-hidden">
        <button class="faq-header w-full px-6 py-4 flex items-center justify-between text-left hover:bg-white/5 transition-colors">
          <span class="font-medium text-white">{{ item.question }}</span>
          <svg class="faq-icon w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div class="faq-content px-6 py-4 text-sm text-gray-400 bg-white/5">
          {{ item.answer }}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
