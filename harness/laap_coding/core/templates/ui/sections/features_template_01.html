<section class="features-section py-20 px-4">
  <div class="max-w-7xl mx-auto">
    <div class="section-header text-center mb-16">
      <span class="section-label inline-block px-4 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold tracking-wider uppercase mb-4">
        {{ section_label }}
      </span>
      <h2 class="section-title text-3xl md:text-4xl font-bold text-white mb-4">{{ title }}</h2>
      <p class="section-desc text-gray-400 max-w-2xl mx-auto">{{ description }}</p>
    </div>
    <div class="features-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for feature in features %}
      <div class="feature-card group p-6 rounded-2xl bg-white/5 border border-white/10 hover:border-indigo-500/30 hover:bg-white/10 hover:-translate-y-1 transition-all duration-300">
        <div class="feature-icon w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500/20 to-purple-500/20 flex items-center justify-center text-indigo-400 mb-4 group-hover:scale-110 transition-transform">
          {{ feature.icon }}
        </div>
        <h3 class="feature-title text-lg font-semibold text-white mb-2">{{ feature.title }}</h3>
        <p class="feature-desc text-gray-400 text-sm leading-relaxed">{{ feature.description }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
