<section class="hero-section relative min-h-screen flex flex-col items-center justify-center px-4 text-center overflow-hidden">
  <div class="hero-bg absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900"></div>
  <div class="hero-particles absolute inset-0 pointer-events-none" id="hero-particles"></div>
  <div class="hero-content relative z-10 max-w-4xl mx-auto">
    <span class="hero-badge inline-flex items-center px-4 py-2 rounded-full bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 text-sm font-medium mb-6">
      {{ badge }}
    </span>
    <h1 class="hero-title text-4xl md:text-6xl lg:text-7xl font-bold mb-6 leading-tight">
      <span class="bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">{{ title }}</span>
    </h1>
    <p class="hero-desc text-lg md:text-xl text-gray-400 mb-10 max-w-2xl mx-auto leading-relaxed">
      {{ description }}
    </p>
    <div class="hero-actions flex flex-col sm:flex-row gap-4 justify-center">
      <button class="cta-primary px-8 py-4 rounded-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold hover:shadow-xl hover:shadow-indigo-500/30 hover:-translate-y-0.5 transition-all duration-300">
        {{ primary_cta }}
      </button>
      <button class="cta-secondary px-8 py-4 rounded-full bg-white/10 border border-white/20 text-white font-semibold hover:bg-white/20 transition-all duration-300">
        {{ secondary_cta }}
      </button>
    </div>
    <div class="hero-stats mt-16 grid grid-cols-3 gap-8 max-w-lg mx-auto">
      {% for stat in stats %}
      <div class="stat-item">
        <div class="stat-value text-2xl md:text-3xl font-bold text-white">{{ stat.value }}</div>
        <div class="stat-label text-xs text-gray-500 mt-1">{{ stat.label }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
  <div class="hero-scroll absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce">
    <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
  </div>
</section>
