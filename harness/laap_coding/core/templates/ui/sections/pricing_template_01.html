<section class="pricing-section py-20 px-4 bg-gradient-to-b from-slate-900 via-slate-900/50 to-slate-900">
  <div class="max-w-6xl mx-auto">
    <div class="section-header text-center mb-16">
      <span class="section-label inline-block px-4 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold tracking-wider uppercase mb-4">
        {{ section_label }}
      </span>
      <h2 class="section-title text-3xl md:text-4xl font-bold text-white mb-4">{{ title }}</h2>
      <p class="section-desc text-gray-400 max-w-2xl mx-auto">{{ description }}</p>
    </div>
    <div class="pricing-grid grid grid-cols-1 md:grid-cols-3 gap-8">
      {% for plan in plans %}
      <div class="pricing-card relative p-8 rounded-2xl bg-white/5 border border-white/10 hover:border-indigo-500/40 transition-all duration-300 {% if plan.featured %}ring-2 ring-indigo-500/50{% endif %}">
        {% if plan.featured %}
        <div class="featured-badge absolute -top-4 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full text-xs font-bold bg-gradient-to-r from-indigo-500 to-purple-600 text-white">
          最受欢迎
        </div>
        {% endif %}
        <h3 class="pricing-title text-xl font-bold text-white mb-2">{{ plan.name }}</h3>
        <div class="pricing-price flex items-baseline gap-1 mb-4">
          <span class="text-4xl font-bold text-white">{{ plan.price }}</span>
          <span class="text-gray-400">/ {{ plan.period }}</span>
        </div>
        <p class="pricing-desc text-gray-400 text-sm mb-6">{{ plan.description }}</p>
        <ul class="pricing-features space-y-3 mb-8">
          {% for feature in plan.features %}
          <li class="flex items-center gap-3 text-sm text-gray-300">
            <svg class="w-5 h-5 text-green-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            {{ feature }}
          </li>
          {% endfor %}
        </ul>
        <button class="w-full py-3 rounded-xl font-semibold transition-all {% if plan.featured %}bg-gradient-to-r from-indigo-500 to-purple-600 text-white hover:shadow-lg hover:shadow-indigo-500/30{% else %}bg-white/10 text-white hover:bg-white/20{% endif %}">
          {{ plan.cta }}
        </button>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
