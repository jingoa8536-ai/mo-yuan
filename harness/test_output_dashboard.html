<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAAP Harness Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-tertiary: #f1f5f9;
  --bg-card: #ffffff;
  --bg-hover: #f1f5f9;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent-primary: #3b82f6;
  --accent-secondary: #0ea5e9;
  --accent-gradient: linear-gradient(135deg, #3b82f6, #0ea5e9);
  --border-color: #e2e8f0;
  --border-hover: #94a3b8;
  --shadow-color: rgba(0, 0, 0, 0.1);
  --shadow-hover: rgba(0, 0, 0, 0.15);
  --font-family: Inter, system-ui, sans-serif;
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-2xl: 1.5rem;
}

.theme-minimal_white {
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-tertiary: #f1f5f9;
  --bg-card: #ffffff;
  --bg-hover: #f1f5f9;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent-primary: #3b82f6;
  --accent-secondary: #0ea5e9;
  --accent-gradient: linear-gradient(135deg, #3b82f6, #0ea5e9);
  --border-color: #e2e8f0;
  --border-hover: #94a3b8;
  --shadow-color: rgba(0, 0, 0, 0.1);
  --shadow-hover: rgba(0, 0, 0, 0.15);
  --font-family: Inter, system-ui, sans-serif;
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-2xl: 1.5rem;
}


        [data-theme="dark"] {
            color-scheme: dark;
        }
        
        [data-theme="light"] {
            color-scheme: light;
        }
        
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        ::selection {
            background-color: var(--accent-primary);
            color: white;
        }
    </style>
</head>
<body data-theme="light">
    <nav class="navbar fixed top-0 left-0 right-0 z-50 px-6 py-4 bg-slate-900/80 backdrop-blur-xl border-b border-white/10">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <div class="navbar-logo flex items-center gap-2">
      <div class="logo-icon w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold">
        
      </div>
      <span class="logo-text text-lg font-bold text-white"></span>
    </div>
    <div class="navbar-links hidden md:flex items-center gap-8">
      
    </div>
    <div class="navbar-actions flex items-center gap-4">
      <button class="action-btn px-4 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition-colors">
        Sign In
      </button>
      <button class="action-btn-primary px-4 py-2 rounded-lg text-sm font-medium bg-indigo-500 text-white hover:bg-indigo-600 transition-colors">
        Get Started
      </button>
    </div>
  </div>
</nav>
<section class="features-section py-20 px-4">
  <div class="max-w-7xl mx-auto">
    <div class="section-header text-center mb-16">
      <span class="section-label inline-block px-4 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold tracking-wider uppercase mb-4">
        
      </span>
      <h2 class="section-title text-3xl md:text-4xl font-bold text-white mb-4"></h2>
      <p class="section-desc text-gray-400 max-w-2xl mx-auto"></p>
    </div>
    <div class="features-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
    </div>
  </div>
</section>

    
    <script>
        function setTheme(themeName) {
            const themeTokens = {"dark_flagship": {"name": "Dark Flagship", "mode": "dark", "tokens": {"--bg-primary": "#0f172a", "--bg-secondary": "#1e293b", "--bg-tertiary": "#334155", "--bg-card": "rgba(255, 255, 255, 0.05)", "--bg-hover": "rgba(255, 255, 255, 0.1)", "--text-primary": "#ffffff", "--text-secondary": "#94a3b8", "--text-muted": "#64748b", "--accent-primary": "#6366f1", "--accent-secondary": "#a855f7", "--accent-gradient": "linear-gradient(135deg, #6366f1, #a855f7)", "--border-color": "rgba(255, 255, 255, 0.1)", "--border-hover": "rgba(99, 102, 241, 0.5)", "--shadow-color": "rgba(99, 102, 241, 0.3)", "--shadow-hover": "rgba(99, 102, 241, 0.4)", "--font-family": "Inter, system-ui, sans-serif", "--radius-sm": "0.375rem", "--radius-md": "0.5rem", "--radius-lg": "0.75rem", "--radius-xl": "1rem", "--radius-2xl": "1.5rem"}}, "minimal_white": {"name": "Minimal White", "mode": "light", "tokens": {"--bg-primary": "#ffffff", "--bg-secondary": "#f8fafc", "--bg-tertiary": "#f1f5f9", "--bg-card": "#ffffff", "--bg-hover": "#f1f5f9", "--text-primary": "#1e293b", "--text-secondary": "#64748b", "--text-muted": "#94a3b8", "--accent-primary": "#3b82f6", "--accent-secondary": "#0ea5e9", "--accent-gradient": "linear-gradient(135deg, #3b82f6, #0ea5e9)", "--border-color": "#e2e8f0", "--border-hover": "#94a3b8", "--shadow-color": "rgba(0, 0, 0, 0.1)", "--shadow-hover": "rgba(0, 0, 0, 0.15)", "--font-family": "Inter, system-ui, sans-serif", "--radius-sm": "0.375rem", "--radius-md": "0.5rem", "--radius-lg": "0.75rem", "--radius-xl": "1rem", "--radius-2xl": "1.5rem"}}, "ocean_blue": {"name": "Ocean Blue", "mode": "dark", "tokens": {"--bg-primary": "#0c1929", "--bg-secondary": "#0a2463", "--bg-tertiary": "#1e3a5f", "--bg-card": "rgba(30, 58, 95, 0.5)", "--bg-hover": "rgba(30, 58, 95, 0.7)", "--text-primary": "#ffffff", "--text-secondary": "#7dd3fc", "--text-muted": "#0ea5e9", "--accent-primary": "#06b6d4", "--accent-secondary": "#38bdf8", "--accent-gradient": "linear-gradient(135deg, #06b6d4, #38bdf8)", "--border-color": "rgba(6, 182, 212, 0.3)", "--border-hover": "rgba(6, 182, 212, 0.6)", "--shadow-color": "rgba(6, 182, 212, 0.3)", "--shadow-hover": "rgba(6, 182, 212, 0.5)", "--font-family": "Inter, system-ui, sans-serif", "--radius-sm": "0.375rem", "--radius-md": "0.5rem", "--radius-lg": "0.75rem", "--radius-xl": "1rem", "--radius-2xl": "1.5rem"}}, "forest_green": {"name": "Forest Green", "mode": "dark", "tokens": {"--bg-primary": "#052e16", "--bg-secondary": "#14532d", "--bg-tertiary": "#166534", "--bg-card": "rgba(20, 83, 45, 0.5)", "--bg-hover": "rgba(20, 83, 45, 0.7)", "--text-primary": "#ffffff", "--text-secondary": "#bbf7d0", "--text-muted": "#86efac", "--accent-primary": "#22c55e", "--accent-secondary": "#4ade80", "--accent-gradient": "linear-gradient(135deg, #22c55e, #4ade80)", "--border-color": "rgba(34, 197, 94, 0.3)", "--border-hover": "rgba(34, 197, 94, 0.6)", "--shadow-color": "rgba(34, 197, 94, 0.3)", "--shadow-hover": "rgba(34, 197, 94, 0.5)", "--font-family": "Inter, system-ui, sans-serif", "--radius-sm": "0.375rem", "--radius-md": "0.5rem", "--radius-lg": "0.75rem", "--radius-xl": "1rem", "--radius-2xl": "1.5rem"}}, "sunset_orange": {"name": "Sunset Orange", "mode": "light", "tokens": {"--bg-primary": "#fff7ed", "--bg-secondary": "#ffedd5", "--bg-tertiary": "#fed7aa", "--bg-card": "#ffffff", "--bg-hover": "#ffedd5", "--text-primary": "#431407", "--text-secondary": "#7c2d12", "--text-muted": "#9a3412", "--accent-primary": "#f97316", "--accent-secondary": "#fb923c", "--accent-gradient": "linear-gradient(135deg, #f97316, #fb923c)", "--border-color": "#fed7aa", "--border-hover": "#f97316", "--shadow-color": "rgba(249, 115, 22, 0.2)", "--shadow-hover": "rgba(249, 115, 22, 0.3)", "--font-family": "Inter, system-ui, sans-serif", "--radius-sm": "0.375rem", "--radius-md": "0.5rem", "--radius-lg": "0.75rem", "--radius-xl": "1rem", "--radius-2xl": "1.5rem"}}, "midnight_purple": {"name": "Midnight Purple", "mode": "dark", "tokens": {"--bg-primary": "#1e1b4b", "--bg-secondary": "#312e81", "--bg-tertiary": "#4c1d95", "--bg-card": "rgba(49, 46, 129, 0.5)", "--bg-hover": "rgba(49, 46, 129, 0.7)", "--text-primary": "#ffffff", "--text-secondary": "#ddd6fe", "--text-muted": "#c4b5fd", "--accent-primary": "#a855f7", "--accent-secondary": "#d946ef", "--accent-gradient": "linear-gradient(135deg, #a855f7, #d946ef)", "--border-color": "rgba(168, 85, 247, 0.3)", "--border-hover": "rgba(168, 85, 247, 0.6)", "--shadow-color": "rgba(168, 85, 247, 0.3)", "--shadow-hover": "rgba(168, 85, 247, 0.5)", "--font-family": "Inter, system-ui, sans-serif", "--radius-sm": "0.375rem", "--radius-md": "0.5rem", "--radius-lg": "0.75rem", "--radius-xl": "1rem", "--radius-2xl": "1.5rem"}}};
            const root = document.documentElement;
            const tokens = themeTokens[themeName].tokens;
            
            for (const [key, value] of Object.entries(tokens)) {
                root.style.setProperty(key, value);
            }
            
            root.setAttribute('data-theme', themeTokens[themeName].mode);
            localStorage.setItem('laap-theme', themeName);
        }
        
        function initTheme() {
            const savedTheme = localStorage.getItem('laap-theme') || 'dark_flagship';
            setTheme(savedTheme);
        }
        
        document.addEventListener('DOMContentLoaded', initTheme);
        
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', function() {
                    const content = this.nextElementSibling;
                    const icon = this.querySelector('.accordion-icon');
                    
                    content.style.display = content.style.display === 'none' ? 'block' : 'none';
                    icon.style.transform = icon.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
                });
            });
            
            document.querySelectorAll('.accordion-content').forEach(content => {
                content.style.display = 'none';
            });
        });
    </script>
</body>
</html>
